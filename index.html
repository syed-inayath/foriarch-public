<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORIARCH | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            outline: none;
        }

        /* Architectural structural grid */
        .blueprint-grid {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-size: 80px 80px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        }

        /* Ambient vignette for depth and legibility */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(10, 10, 10, 0.4) 0%, rgba(10, 10, 10, 0.88) 80%);
        }

        /* Subtle architectural corner crosshairs */
        .crosshair {
            position: fixed;
            width: 12px;
            height: 12px;
            z-index: 4;
            pointer-events: none;
            opacity: 0.25;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: #ffffff;
        }
        .crosshair::before { top: 5px; left: 0; width: 12px; height: 1px; }
        .crosshair::after { top: 0; left: 5px; width: 1px; height: 12px; }
        .ch-tl { top: 32px; left: 32px; }
        .ch-tr { top: 32px; right: 32px; }
        .ch-bl { bottom: 32px; left: 32px; }
        .ch-br { bottom: 32px; right: 32px; }

        .content-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
        }

        .container {
            max-width: 680px;
            text-align: center;
            pointer-events: auto;
            user-select: none;
        }

        .tagline {
            display: inline-block;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: #4a90e2;
            margin-bottom: 24px;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3.2rem, 8vw, 5.5rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            line-height: 1.05;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #ffffff 40%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 80px rgba(255, 255, 255, 0.08);
        }

        p {
            font-size: clamp(1.05rem, 2.5vw, 1.22rem);
            font-weight: 300;
            color: #a0a0a0;
            line-height: 1.7;
            letter-spacing: 0.01em;
            max-width: 580px;
            margin: 0 auto;
        }

        @media (max-width: 640px) {
            .tagline {
                letter-spacing: 0.25em;
                font-size: 0.72rem;
                margin-bottom: 18px;
            }
            .ch-tl, .ch-tr, .ch-bl, .ch-br {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="blueprint-grid"></div>
    <div class="vignette"></div>

    <div class="crosshair ch-tl"></div>
    <div class="crosshair ch-tr"></div>
    <div class="crosshair ch-bl"></div>
    <div class="crosshair ch-br"></div>

    <main class="content-layer">
        <div class="container">
            <span class="tagline">The Future of AI Architecture</span>
            <h1>FORIARCH</h1>
            <p>We are currently building the next generation of generative AI CAD tools. Something incredible is coming.</p>
        </div>
    </main>

    <script>
        let scene, camera, renderer;
        let structureGroup, wireframeMesh, innerMesh, nodesMesh;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let isDragging = false;
        let previousPointer = { x: 0, y: 0 };

        function initScene() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a0a, 0.032);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.2, 17.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x0a0a0a, 1);
            container.appendChild(renderer.domElement);

            structureGroup = new THREE.Group();
            scene.add(structureGroup);

            // Construct Parametric Tower Geometry with twisting generative curves
            const radiusTop = 2.4;
            const radiusBottom = 4.2;
            const height = 18;
            const radialSegments = 24;
            const heightSegments = 38;

            const geometry = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments, heightSegments, false);
            const pos = geometry.attributes.position;
            const twistAngle = 2.4; // Radians

            for (let i = 0; i < pos.count; i++) {
                const y = pos.getY(i);
                const normY = (y + height / 2) / height; // 0 to 1
                const angle = normY * twistAngle;
                const x = pos.getX(i);
                const z = pos.getZ(i);

                // Rotational twist with subtle architectural organic curvature
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                const bulge = Math.sin(normY * Math.PI) * 0.45;

                pos.setX(i, (x * cosA - z * sinA) * (1 + bulge * 0.15));
                pos.setZ(i, (x * sinA + z * cosA) * (1 + bulge * 0.15));
            }
            geometry.computeVertexNormals();

            // Outer delicate wireframe in #4a90e2 with high elegance
            const wireframeMat = new THREE.MeshBasicMaterial({
                color: 0x4a90e2,
                wireframe: true,
                transparent: true,
                opacity: 0.32
            });
            wireframeMesh = new THREE.Mesh(geometry, wireframeMat);
            structureGroup.add(wireframeMesh);

            // Inner translucent dark architectural core matching #0a0a0a and #ffffff reflections
            const innerMat = new THREE.MeshPhysicalMaterial({
                color: 0x0a0a0a,
                roughness: 0.25,
                metalness: 0.9,
                transparent: true,
                opacity: 0.75,
                clearcoat: 0.4
            });
            innerMesh = new THREE.Mesh(geometry, innerMat);
            structureGroup.add(innerMesh);

            // Structural nodes / BIM intersection vertices in pure white #ffffff
            const nodeMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.05,
                transparent: true,
                opacity: 0.55
            });
            nodesMesh = new THREE.Points(geometry, nodeMat);
            structureGroup.add(nodesMesh);

            // Minimalist Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const lightTop = new THREE.DirectionalLight(0xffffff, 0.8);
            lightTop.position.set(5, 10, 7);
            scene.add(lightTop);

            const blueAccentLight = new THREE.PointLight(0x4a90e2, 1.2, 30);
            blueAccentLight.position.set(-6, -4, 4);
            scene.add(blueAccentLight);

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupInteraction();
        }

        function setupInteraction() {
            window.addEventListener('pointermove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) * 0.00045;
                mouseY = (e.clientY - window.innerHeight / 2) * 0.00045;
            });

            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousPointer = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousPointer.x;
                const deltaY = e.clientY - previousPointer.y;

                structureGroup.rotation.y += deltaX * 0.006;
                structureGroup.rotation.x += deltaY * 0.006;

                previousPointer = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => {
                isDragging = false;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isDragging) {
                structureGroup.rotation.y += 0.0022;
                structureGroup.rotation.x += 0.0006;
            }

            // Smooth parallax interpolation
            targetX += (mouseX - targetX) * 0.04;
            targetY += (mouseY - targetY) * 0.04;

            camera.position.x = targetX * 10;
            camera.position.y = 1.2 + (-targetY * 6);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initScene();
            animate();
        };
    </script>
</body>
</html>
