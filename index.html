<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORIARCH | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --glass-bg: rgba(15, 15, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* 1. BRUTALISM: Subtle Film Noise Overlay */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.05;
            mix-blend-mode: screen;
        }

        /* 2. ORGANIC FLUID: Smooth Slow Animated Gradients */
        .fluid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #020202;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-1 {
            width: 50vw;
            height: 50vw;
            background: #2a2a2a;
            top: -10vw;
            left: -10vw;
            animation-duration: 25s;
        }

        .orb-2 {
            width: 60vw;
            height: 60vw;
            background: #111111;
            bottom: -20vw;
            right: -10vw;
            animation-duration: 30s;
            animation-direction: alternate-reverse;
        }

        .orb-3 {
            width: 40vw;
            height: 40vw;
            background: #1f1f1f;
            top: 40%;
            left: 30%;
            animation-duration: 20s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 10vh) scale(1.1); }
        }

        /* 3. BRUTALISM: Massive Background Marquee */
        .marquee-wrapper {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100vw;
            transform: translateY(-50%);
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 50s linear infinite;
        }

        .bg-text {
            font-family: 'Syne', sans-serif;
            font-size: 25vw;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.025);
            white-space: nowrap;
            letter-spacing: -0.05em;
            user-select: none;
            padding-right: 2vw;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 4. APPLE LUXURY & GLASSMORPHISM: The Center Card */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: #000000;
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border-top);
            border-radius: 32px;
            padding: 4rem 3.5rem;
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 
                0 30px 100px rgba(255, 255, 255, 0.04),
                0 0 30px rgba(255, 255, 255, 0.015),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .desc {
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 0;
        }

        /* UI Details */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            margin: 2rem 0;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            padding: 12px 24px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 2.5rem;
        }

        .action-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
            transition: transform 0.3s ease;
        }

        .action-btn:hover svg {
            transform: translateX(4px);
        }

        .card-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1.5rem;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(255,255,255,0.8); }
            50% { opacity: 0.3; box-shadow: 0 0 0px rgba(255,255,255,0); }
        }

        /* Studio Corner Labels */
        .studio-labels {
            position: fixed;
            z-index: 20;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .tl { top: 40px; left: 40px; }
        .tr { top: 40px; right: 40px; text-align: right; }
        .bl { bottom: 40px; left: 40px; }
        .br { bottom: 40px; right: 40px; text-align: right; }

        /* Mobile UI/UX Optimizations */
        @media (max-width: 600px) {
            .glass-card { 
                padding: 2.5rem 1.5rem; 
                border-radius: 24px; 
            }
            h1 {
                font-size: 2.1rem;
                margin-bottom: 1rem;
            }
            .desc {
                font-size: 0.95rem;
            }
            .bg-text { 
                font-size: 45vw;
                padding-right: 5vw;
            }
            .studio-labels { 
                display: none; 
            }
        }
    </style>
</head>
<body>




    <!-- Brutalist Massive Marquee -->
    <div class="marquee-wrapper">
        <div class="marquee-track">
            <div class="bg-text">FORIARCH / FORIARCH / FORIARCH / </div>
            <div class="bg-text">FORIARCH / FORIARCH / FORIARCH / </div>
        </div>
    </div>

    <!-- Corner Branding -->
    <div class="studio-labels tl">FORIARCH<br>STUDIO</div>
    <div class="studio-labels tr">TOKYO / LA<br>EST. 2026</div>
    <div class="studio-labels bl">STATUS<br>INITIALIZING</div>
    <div class="studio-labels br">AI ARCHITECTURE<br>SYSTEM V1</div>

    <!-- Luxury Apple Glassmorphism -->
    <main class="main-content">
        <div class="glass-card">
            <h1>FORIARCH</h1>
            <p class="desc">The future of intelligent architectural design is currently rendering.</p>
            

        </div>
    </main>

</body>
</html>
